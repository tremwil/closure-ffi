name: Checks
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: cargo clippy
    strategy:
      fail-fast: false
      matrix:
        features:
          - --no-default-features
          - --no-default-features -F global_jit_alloc
          - --no-default-features -F std,global_jit_alloc
          - ""
          - -F proc_macros
          - -F tuple_trait,coverage
        include:
          - toolchain: stable
          - features: -F tuple_trait,coverage
            toolchain: nightly

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - run: RUSTFLAGS="-Dwarnings" cargo clippy --workspace --all-targets ${{ matrix.features }}

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: RUSTDOCFLAGS="--cfg docsrs" cargo +nightly doc --no-deps -F proc_macros

  build-and-test-native:
    name: Build and test (native)
    strategy:
      fail-fast: false
      matrix:
        target:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: i686-pc-windows-msvc
            runner: windows-latest
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
        features:
          - "-F proc_macros"
          - "-F tuple_trait,coverage"
          - "--no-default-features -F global_jit_alloc"
        include:
          - toolchain: stable
          # Enable nightly rust for the nightly feature
          - features: "-F tuple_trait,coverage"
            toolchain: nightly
    
    needs: [fmt, check] # don't bother running tests if cargo check/fmt doesn't pass
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install gcc-multilib for i686 cross-compilation
        if: ${{ matrix.target.target == 'i686-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target.target }}
      - name: Build and test (debug)
        id: test-debug
        run: cargo test --target ${{ matrix.target.target }} ${{ matrix.features }}
      - name: Build and test (release)
        if: ${{ success() || steps.test-debug.conclusion == 'failure' }}
        run: cargo test --target ${{ matrix.target.target }} --release ${{ matrix.features }}
  
  build-and-test-cross:
    name: Build and test (cross-rs)
    strategy:
      fail-fast: false
      matrix:
        target:
          - armv7-unknown-linux-gnueabi
          - armv7-unknown-linux-gnueabihf
          - thumbv7neon-unknown-linux-gnueabihf
        features:
          - "-F proc_macros"
          - "-F tuple_trait,coverage"
          - "--no-default-features -F global_jit_alloc"
        include:
          - nightly: ""
          # Enable nightly rust for the nightly feature
          - features: "-F tuple_trait,coverage"
            nightly: +nightly

    needs: [fmt, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Setup cargo binstall
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
      - name: Install cargo cross 
        run: cargo binstall cross
      - name: Build and test (debug)
        id: test-debug
        run: cross ${{ matrix.nightly }} test --target ${{ matrix.target }} ${{ matrix.features }}
      - name: Build and test (release)
        if: ${{ success() || steps.test-debug.conclusion == 'failure' }}
        run: cross ${{ matrix.nightly }} test --target ${{ matrix.target }} ${{ matrix.features }}

  check-release-readiness:
    name: Release readiness checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Is this a release PR
        id: is-release
        run: python ./.github/scripts/is_release.py >> "${GITHUB_OUTPUT}"
      - name: Publish dry-run
        if: ${{ steps.is-release.outputs.is_release == 'true' }}
        run: cargo publish --workspace --dry-run
      - name: Generate release notes
        if: ${{ steps.is-release.outputs.is_release == 'true' }}
        run: python ./.github/scripts/release_notes.py

  all_checks_pass:
    needs:
      - fmt
      - check
      - doc
      - build-and-test-native
      - build-and-test-cross
    runs-on: ubuntu-latest
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        jobs: ${{ toJSON(needs) }}
