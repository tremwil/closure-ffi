name: Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Is this a release PR
        id: is-release
        run: python ./.github/scripts/is_release.py >> "${GITHUB_OUTPUT}"
    outputs:
      is-release: ${{ steps.is-release.outputs.is_release }}

  publish:
    name: cargo publish and crate release
    needs:
      - is-release
    if: needs.is-release.outputs.is-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      
      - name: crates.io publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Get package version
        id: get_version
        run: echo "version=$(python ./.github/scripts/package_version.py)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: python ./.github/scripts/release_notes.py > release-notes.md

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          body_path: release-notes.md
