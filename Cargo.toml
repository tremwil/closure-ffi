[workspace]
members = ["proc_macros"]

[workspace.package]
edition = "2021"
authors = ["William Tremblay <tremwil@users.noreply.github.com>"]
keywords = ["closure", "ffi"]
categories = ["development-tools::ffi", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tremwil/closure-ffi"

[package]
name = "closure-ffi"
version = "5.2.0"
description = "FFI utility for creating bare function pointers that invoke a closure"
rust-version = "1.95"
edition.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
repository.workspace = true

[[example]]
name = "context_hooking"
crate-type = ["lib"]
test = true

[features]
default = [
    "std",
    "default_jit_alloc",
    "shm_open_jit_alloc",
    "tmp_file_jit_alloc",
]
std = []
global_jit_alloc = []
# spin is needed on no_std, but not std.
# Sadly there is no way to enable a dependency when a feature is *not* set
default_jit_alloc = [
    "global_jit_alloc",
    "dep:clear-cache",
    "dep:libc",
    "dep:spin",
    "dep:rlsf",
]
asharedmem_jit_alloc = ["dep:ndk-sys"]
shm_open_jit_alloc = []
tmp_file_jit_alloc = []
more_args_18 = []
more_args_24 = []

unstable = []
tuple_trait = ["unstable"]
coverage = ["unstable"]
proc_macros = ["dep:closure-ffi-proc-macros"]

[dependencies]
closure-ffi-proc-macros = { path = "proc_macros", version = "6.1.0", optional = true }
spin = { version = "0.12.3", optional = true, default-features = false, features = [
    "mutex",
    "spin_mutex",
] }
clear-cache = { version = "0.1.3", optional = true }
rlsf = { version = "0.2.3", optional = true }
rustversion = "1.0.23"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = { version = "0.6.0", optional = true, default-features = false }

[target.'cfg(target_arch = "arm")'.dependencies]
portable-atomic = "1.15.0"

[target.'cfg(target_arch = "arm")'.build-dependencies]
arm-targets = "0.4.3"

[dev-dependencies]
clear-cache = "0.1.3"
libc = { version = "0.2", default-features = false }
region = "4.0.1"
spin = "0.12.3"

[package.metadata.docs.rs]
features = ["proc_macros"]
rustdoc-args = ["--cfg", "docsrs"]
